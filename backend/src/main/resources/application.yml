spring:
  application:
    name: yunhefc
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yunhefc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:yunhefc}
    password: ${DB_PASSWORD:yunhefc}
    hikari:
      # 驱动属性覆盖 DB_URL：即使环境变量仍带 serverTimezone=UTC，也按 Asia/Shanghai 解释 DATETIME。
      data-source-properties:
        connectionTimeZone: Asia/Shanghai
      # 会话固定 +08:00：DEFAULT CURRENT_TIMESTAMP(3) / ON UPDATE 与驱动 connectionTimeZone 对齐。
      connection-init-sql: "SET time_zone = '+08:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  quartz:
    job-store-type: jdbc
    overwrite-existing-jobs: true
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: yunhefc
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: manual_immediate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: ${SESSION_NAMESPACE:yunhefc:session}
      save-mode: always
  servlet:
    multipart:
      # 全局 multipart 上限 5MiB；头像与场地环境图均为 5MiB，由应用层按端点兜住。
      max-file-size: 5242880B
      max-request-size: 6MB

yunhefc:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5273}
  auth:
    login-rate-limit:
      max-attempts: ${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:50}
      window: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:1m}
    sms-rate-limit:
      ip-max-per-hour: ${AUTH_SMS_IP_RATE_LIMIT_MAX_PER_HOUR:10}
  audit:
    export:
      enabled: ${AUDIT_EXPORT_ENABLED:false}
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:false}
    mock-code: ${SMS_MOCK_CODE:123456}
    ttl-seconds: ${SMS_TTL_SECONDS:300}
    endpoint: ${SMS_ENDPOINT:https://gyytz.market.alicloudapi.com/sms/smsSend}
    app-code: ${SMS_APPCODE:}
    template-id: ${SMS_TEMPLATE_ID:}
    sign-id: ${SMS_SIGN_ID:}
  invite:
    expiry-cron: ${INVITE_EXPIRY_CRON:0 0 3 * * ?}
    zone: ${INVITE_EXPIRY_ZONE:Asia/Shanghai}
  retention:
    notification-days: ${RETENTION_NOTIFICATION_DAYS:90}
    invite-days: ${RETENTION_INVITE_DAYS:30}
    outbox-days: ${RETENTION_OUTBOX_DAYS:7}
    consumed-event-days: ${RETENTION_CONSUMED_EVENT_DAYS:7}
  session:
    c-ttl: 7d
    b-ttl: 2h
    handoff-ttl: 60s
    cookie-domain: ${SESSION_COOKIE_DOMAIN:}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5273,http://localhost:5274}
  kafka:
    audit-topic: ${KAFKA_AUDIT_TOPIC:yunhefc.audit.events}
    notification-topic: ${KAFKA_NOTIFICATION_TOPIC:yunhefc.notification.events}
    listener-enabled: ${KAFKA_LISTENER_ENABLED:true}
    retry:
      max-retries: ${KAFKA_RETRY_MAX_RETRIES:3}
      interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:60000}
  oss:
    mode: ${OSS_MODE:mock}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  wechat:
    mini:
      enabled: ${WECHAT_MINI_ENABLED:false}
      mode: ${WECHAT_MINI_MODE:mock}
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
      connect-timeout: ${WECHAT_MINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${WECHAT_MINI_READ_TIMEOUT:5s}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
