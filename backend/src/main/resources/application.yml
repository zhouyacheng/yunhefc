spring:
  application:
    name: yunhefc
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yunhefc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:yunhefc}
    password: ${DB_PASSWORD:yunhefc}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  quartz:
    job-store-type: jdbc
    overwrite-existing-jobs: true
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: yunhefc
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: manual_immediate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: ${SESSION_NAMESPACE:yunhefc:session}
      save-mode: always

yunhefc:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:false}
    mock-code: ${SMS_MOCK_CODE:123456}
    ttl-seconds: ${SMS_TTL_SECONDS:300}
  invite:
    expiry-cron: ${INVITE_EXPIRY_CRON:0 0 3 * * ?}
    zone: ${INVITE_EXPIRY_ZONE:Asia/Shanghai}
  session:
    c-ttl: 7d
    b-ttl: 2h
    cookie-domain: ${SESSION_COOKIE_DOMAIN:}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  kafka:
    audit-topic: ${KAFKA_AUDIT_TOPIC:yunhefc.audit.events}
    notification-topic: ${KAFKA_NOTIFICATION_TOPIC:yunhefc.notification.events}
    listener-enabled: ${KAFKA_LISTENER_ENABLED:true}
    retry:
      max-retries: ${KAFKA_RETRY_MAX_RETRIES:3}
      interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:60000}
  wechat:
    enabled: ${WECHAT_ENABLED:false}
    mode: ${WECHAT_MODE:mock}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    callback-url: ${WECHAT_CALLBACK_URL:}
    allowed-redirect-prefixes: ${WECHAT_ALLOWED_REDIRECT_PREFIXES:/}
    require-wechat-ua: ${WECHAT_REQUIRE_UA:true}
    state-ttl-seconds: ${WECHAT_STATE_TTL_SECONDS:300}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
