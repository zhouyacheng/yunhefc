# 生产服务编排：MySQL 8.4 使用宿主已预置的官方镜像，在 Compose 内自建（仅内网，不发布 3306）。
# 与 docker-compose.prod.yml 一起使用，镜像 tag 由 release.sh 通过环境变量注入。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    # 宿主预置镜像，不经 ACR；发布链路不访问 Docker Hub。
    image: mysql:8.4
    environment:
      # TZ=Asia/Shanghai 使 system_time_zone 为 CST。
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
      MYSQL_DATABASE: yunhefc
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME 未设置}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置}
    command:
      # 会话默认时区 +08:00；字符集与 04 约定一致。
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 2C2G 宿主：压缩后台缓存与 X Plugin 占用。
      - --innodb-buffer-pool-size=192M
      - --performance-schema=OFF
      - --mysqlx=OFF
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 认证查询而非 mysqladmin ping：后者在口令错误时仍返回成功。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

  backend:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 未设置}/yunhefc-backend:${IMAGE_TAG:?IMAGE_TAG 未设置}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # readiness 覆盖 DB 与 Redis；启动期给 JVM/Flyway 留足时间。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

  redis:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 未设置}/yunhefc-infra-redis:6.2.24
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 128mb
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --dir /data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 未设置}/yunhefc-nginx:${IMAGE_TAG:?IMAGE_TAG 未设置}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 未设置}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

volumes:
  backend-logs:
  redis-data:
  mysql-data:

networks:
  app:
    driver: bridge
