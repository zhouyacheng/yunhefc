# 生产服务编排：MySQL 使用阿里云 RDS，不在 Compose 内。
# 与 docker-compose.prod.yml 一起使用，镜像 tag 由 release.sh 通过环境变量注入。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 未设置}/yunhefc-backend:${IMAGE_TAG:?IMAGE_TAG 未设置}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_FILE_PATH: /app/logs
    volumes:
      - backend-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # readiness 覆盖 DB 与 Redis；启动期给 JVM/Flyway 留足时间。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

  redis:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 未设置}/yunhefc-infra-redis:6.2.24
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 128mb
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --dir /data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY 未设置}/yunhefc-nginx:${IMAGE_TAG:?IMAGE_TAG 未设置}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 未设置}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app

volumes:
  backend-logs:
  redis-data:

networks:
  app:
    driver: bridge
